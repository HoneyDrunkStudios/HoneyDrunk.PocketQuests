name: Validate Pocket Quests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    # Both disposable-SQL passes take about 20 minutes before restore/build.
    # Allow hosted-runner variance without skipping either verification lane.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: product
          fetch-depth: 0
      - name: Verify coverage collection contract without SQL
        shell: pwsh
        run: ./product/scripts/tests/Test-CoverageCollection.ps1
      - name: Verify explicit Identity initialization modes
        shell: pwsh
        run: ./product/scripts/tests/Test-InitializeLocal.ps1
      - name: Measure development launcher and cleanup coverage without SQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = Join-Path $env:RUNNER_TEMP 'pocketquests-test-modules'
          $null = New-Item -ItemType Directory -Force -Path $modules
          Save-PSResource -Name Pester -Version 6.2.0 -Repository PSGallery -Path $modules -TrustRepository
          ./product/scripts/tests/Invoke-DevelopmentToolingTests.ps1 -PesterModulePath "$modules/Pester/6.2.0/Pester.psd1"
      - uses: actions/checkout@v5
        with:
          repository: HoneyDrunkStudios/HoneyDrunk.Identity
          ref: 5cfc1da16f075b566e845df8ba81de5f0e4347a8
          path: identity
      - name: Read the declared SDK baseline
        id: dotnet_version
        shell: pwsh
        run: '"version=$((Get-Content product/global.json -Raw | ConvertFrom-Json).sdk.version)" >> $env:GITHUB_OUTPUT'
      - uses: actions/setup-dotnet@v5
        with:
          # Install the declared baseline, not an unrelated latest-channel download.
          # The repository retains its normal latestPatch build resolution.
          dotnet-version: ${{ steps.dotnet_version.outputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Configure explicit Identity source
        shell: pwsh
        run: ./product/scripts/Initialize-Local.ps1 -IdentitySourceRoot "$env:GITHUB_WORKSPACE/identity"
      - name: Restore locked source dependencies
        run: dotnet restore product/HoneyDrunk.PocketQuests.slnx --locked-mode
      - name: Install SonarScanner for .NET
        id: sonar_install
        continue-on-error: true
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        shell: pwsh
        run: dotnet tool install dotnet-sonarscanner --tool-path "$env:RUNNER_TEMP/sonar-scanner"
      - name: Begin API and mobile analysis
        id: sonar_begin
        continue-on-error: true
        if: steps.sonar_install.outcome == 'success' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        working-directory: product
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) { throw 'SONAR_TOKEN is not bound to this repository.' }
          & "$env:RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" begin `
            /k:"HoneyDrunkStudios_HoneyDrunk.PocketQuests" /o:"honeydrunkstudios" `
            /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.projectBaseDir="$env:GITHUB_WORKSPACE/product" `
            /d:sonar.scanner.scanAll=true `
            /d:sonar.tsql.file.suffixes=".sql,.tsql" `
            /d:sonar.plsql.file.suffixes=".plsql,.pks,.pkb" `
            /d:sonar.test.inclusions="**/*.Tests/**,**/*.SchemaTests/**,apps/mobile/tests/**,apps/mobile/e2e/**,scripts/tests/**,scripts/schema/test_*.py,scripts/schema/*-probes.sql,scripts/schema/negative-constraints.sql" `
            /d:sonar.exclusions="**/node_modules/**,**/bin/**,**/obj/**,**/.expo/**,.local/**,.packages/**,artifacts/**,apps/mobile/dist/**,apps/mobile/coverage/**,apps/mobile/reports/**,apps/mobile/packages/**,apps/mobile/src/api/generated.ts,apps/mobile/src/api/runtime-schemas.json" `
            /d:sonar.cs.opencover.reportsPaths="artifacts/identity-validation/**/coverage.opencover.xml" `
            /d:sonar.javascript.lcov.reportPaths="apps/mobile/coverage/lcov.info" `
            /d:sonar.python.coverage.reportPaths="artifacts/python-coverage.xml" `
            /d:sonar.coverageReportPaths="artifacts/development-tooling/sonar-coverage.xml" `
            /d:sonar.qualitygate.wait=true /d:sonar.qualitygate.timeout=300
      - name: Build solution and DACPACs
        # MSBuild must discover the same .sonarqube directory as begin/end.
        working-directory: product
        run: dotnet build HoneyDrunk.PocketQuests.slnx --configuration Release --no-restore --no-incremental
      - name: Verify compiled backend architecture without SQL
        shell: pwsh
        run: ./product/scripts/Test-BackendArchitecture.ps1 -NoBuild -Configuration Release
      - name: Verify endpoint OpenAPI and wire compatibility
        shell: pwsh
        run: ./product/scripts/Test-ApiContract.ps1 -NoBuild -Configuration Release
      - name: Test SQL and domain boundaries
        shell: pwsh
        run: ./product/scripts/Test-RelationalSchema.ps1 -NoBuild -IdentityIntegration -CollectCoverage -EvidenceDirectory product/artifacts/identity-validation
      - name: Validate relational schema and EF parity in disposable SQL
        shell: pwsh
        run: ./product/scripts/Test-RelationalSchema.ps1 -NoBuild
      - name: Install mobile dependencies and collect real LCOV coverage
        working-directory: product/apps/mobile
        run: npm ci --ignore-scripts && node scripts/patch-dependencies.cjs && npm run test:coverage
      - name: Map mobile LCOV paths to the scanner root
        shell: pwsh
        run: |
          $report = 'product/apps/mobile/coverage/lcov.info'
          $content = Get-Content -LiteralPath $report
          if (-not ($content -match '^SF:src[\\/]') -or -not ($content -match '^DA:')) {
            throw 'Mobile LCOV is missing measured authored-source coverage.'
          }
          $content | ForEach-Object {
            if ($_ -like 'SF:*') {
              'SF:apps/mobile/' + $_.Substring(3).Replace('\', '/')
            } else { $_ }
          } | Set-Content -LiteralPath $report -Encoding utf8
      - name: Collect Python contract-validator coverage
        working-directory: product
        shell: pwsh
        env:
          COVERAGE_FILE: artifacts/python.coverage
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --only-binary=:all: coverage==7.16.2
          python -m coverage run --source=scripts/schema -m unittest discover -s scripts/schema -p test_contract.py
          python -m coverage xml -o artifacts/python-coverage.xml
      - name: Complete API and mobile analysis and await the quality gate
        id: sonar_end
        if: steps.sonar_begin.outcome == 'success' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        working-directory: product
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"
      - name: Enforce analysis outcome after product validation
        if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        shell: pwsh
        env:
          SONAR_INSTALL_OUTCOME: ${{ steps.sonar_install.outcome }}
          SONAR_BEGIN_OUTCOME: ${{ steps.sonar_begin.outcome }}
          SONAR_END_OUTCOME: ${{ steps.sonar_end.outcome }}
        run: |
          # Startup failures must not skip product tests or become a green job.
          if ($env:SONAR_INSTALL_OUTCOME -ne 'success' -or $env:SONAR_BEGIN_OUTCOME -ne 'success' -or $env:SONAR_END_OUTCOME -ne 'success') {
            throw 'Sonar analysis did not complete successfully. Product validation evidence is retained separately.'
          }
      - name: Retain disposable SQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sql-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            product/artifacts/identity-validation/tests.log
            product/artifacts/identity-validation/schema-tests.trx
            product/artifacts/identity-validation/run.json
            product/artifacts/schema-validation/tests.log
            product/artifacts/schema-validation/schema-tests.trx
            product/artifacts/schema-validation/run.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/patch-dependencies.cjs
      - run: npm run check:security-patch
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:logic
      - run: node node_modules/expo/bin/cli export --platform web
        env:
          # This is a local fixture bundle. EAS preview/production profiles must
          # supply explicit public HTTPS service URLs and pass the release guard.
          EXPO_PUBLIC_APP_ENV: development
