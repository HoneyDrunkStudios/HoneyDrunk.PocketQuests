name: Validate Pocket Quests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          path: product
      - uses: actions/checkout@v5
        with:
          repository: HoneyDrunkStudios/HoneyDrunk.Identity
          ref: a18ba880351b0a76d87c6b68eac45b38551c4e1a
          path: identity
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: product/global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Configure explicit Identity source
        shell: pwsh
        run: ./product/scripts/Initialize-Local.ps1 -IdentitySourceRoot "$env:GITHUB_WORKSPACE/identity"
      - name: Restore locked source dependencies
        run: dotnet restore product/HoneyDrunk.PocketQuests/HoneyDrunk.PocketQuests.slnx --locked-mode
      - name: Build solution and DACPACs
        run: dotnet build product/HoneyDrunk.PocketQuests/HoneyDrunk.PocketQuests.slnx --configuration Release --no-restore
      - name: Verify endpoint OpenAPI and wire compatibility
        shell: pwsh
        run: ./product/scripts/Test-ApiContract.ps1 -NoBuild -Configuration Release
      - name: Test SQL and domain boundaries
        shell: pwsh
        run: ./product/scripts/Test-RelationalSchema.ps1 -NoBuild -IdentityIntegration -EvidenceDirectory product/artifacts/identity-validation
      - name: Validate relational schema and EF parity in disposable SQL
        shell: pwsh
        run: ./product/scripts/Test-RelationalSchema.ps1 -NoBuild
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:logic
      - run: npx expo export --platform web
        env:
          # This is a local fixture bundle. EAS preview/production profiles must
          # supply explicit public HTTPS service URLs and pass the release guard.
          EXPO_PUBLIC_APP_ENV: development
